# Repository settings:
# - Enable Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# - Grant the GitHub App Commit statuses, Contents, Pull requests, and Workflows read/write
#   permissions, and Metadata read-only permission.
# - Add the APP_CLIENT_ID and APP_PRIVATE_KEY Actions secrets for that GitHub App.
name: Renovate

on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: info
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: ${{ github.repository }}
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          configurationFile: renovate-config.json
          token: ${{ steps.app-token.outputs.token }}
