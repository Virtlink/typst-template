name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: mise run build

      - uses: actions/upload-artifact@v7
        with:
          name: document-${{ runner.os }}
          path: dist/main.pdf
